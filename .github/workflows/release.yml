name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & package (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --verbose

      - name: Test
        run: cargo test --release --verbose

      - name: Stage bundle
        shell: pwsh
        run: |
          $stage = "stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/phonesvc.exe"      "$stage/phonesvc.exe"
          Copy-Item "target/release/phonesvc-cli.exe"  "$stage/phonesvc-cli.exe"
          Copy-Item "vendor/libusb-1.0.dll"            "$stage/libusb-1.0.dll"
          Copy-Item "dist/README.md"                   "$stage/README.md"
          Copy-Item "THIRD_PARTY_NOTICES.md"           "$stage/THIRD_PARTY_NOTICES.md"
          Get-ChildItem $stage | Format-Table Name,Length

      - name: Package zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "phonesvc-$tag-windows-x64.zip"
          Compress-Archive -Path "stage/*" -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Built $zip"
          Get-Item $zip | Format-Table Name,Length

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: phonesvc-*-windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false